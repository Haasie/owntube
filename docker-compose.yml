services:
  invidious-db:
    container_name: invidious-db
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kemal_secure_pass}
    volumes:
      - invidious-postgresdata:/var/lib/postgresql/data
      - /home/haasie/owntube/invidious-init/sql:/config/sql:ro
      - /home/haasie/owntube/invidious-init/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cosmos-network

  invidious-companion:
    container_name: invidious-companion
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=${COMPANION_KEY}
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - invidious-companion-cache:/var/tmp/youtubei.js:rw
    depends_on:
      invidious-db:
        condition: service_healthy
    networks:
      - cosmos-network
    labels:
      - "cosmos-auto-update=true"

  invidious:
    container_name: invidious
    image: quay.io/invidious/invidious:master
    restart: unless-stopped
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: "${POSTGRES_PASSWORD}"
          host: invidious-db
          port: 5432
        check_tables: true
        domain: invidious.haasie.nl
        external_port: 443
        https_only: true
        statistics_enabled: false
        hmac_key: "${HMAC_KEY}"
        invidious_companion:
          - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "${COMPANION_KEY}"
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-nv", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cosmos-network
    labels:
      - "cosmos-auto-update=true"

  owntube:
    container_name: owntube
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: owntube:latest
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/apps/web/data/owntube.db
      PIPED_BASE_URL: disabled
      INVIDIOUS_BASE_URL: http://invidious:3000
      INVIDIOUS_PUBLIC_BASE_URL: https://invidious.haasie.nl
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://youtube.haasie.nl}
      APP_BASE_URL: ${APP_BASE_URL:-https://youtube.haasie.nl}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Amsterdam
      INVIDIOUS_DIRECT_DASH_SEGMENTS: "false"
      INVIDIOUS_DIRECT_HLS_SEGMENTS: "false"
      INVIDIOUS_COMPANION_INTERNAL_URL: http://invidious-companion:8282
      INVIDIOUS_COMPANION_SECRET_KEY: ${COMPANION_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - owntube-data:/app/apps/web/data
    depends_on:
      invidious:
        condition: service_healthy
    networks:
      - cosmos-network
    labels:
      - "cosmos-auto-update=false"

  owntube-cache-warmer:
    container_name: owntube-cache-warmer
    image: owntube:latest
    restart: unless-stopped
    depends_on:
      owntube:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/apps/web/data/owntube.db
      PIPED_BASE_URL: disabled
      INVIDIOUS_BASE_URL: http://invidious:3000
      OWNTUBE_WARM_INTERVAL_SEC: ${OWNTUBE_WARM_INTERVAL_SEC:-1200}
      OWNTUBE_WARM_REGION: ${OWNTUBE_WARM_REGION:-NL}
      OWNTUBE_WARM_LIMIT: 48
      OWNTUBE_WARM_CHANNELS: "true"
      OWNTUBE_WARM_CHANNEL_PAGES: "true"
      OWNTUBE_WARM_SHORTS: "true"
      OWNTUBE_WARM_HISTORY_CHANNELS: 32
      OWNTUBE_WARM_SUBSCRIPTION_CHANNELS: 64
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Amsterdam
    volumes:
      - owntube-data:/app/apps/web/data
    command: >
      sh -c 'while true; do
        pnpm warm:cache || true;
        sleep $${OWNTUBE_WARM_INTERVAL_SEC:-1200};
      done'
    networks:
      - cosmos-network
    labels:
      - "cosmos-auto-update=false"

networks:
  cosmos-network:
    name: cosmos-network
    external: true

volumes:
  invidious-postgresdata:
  invidious-companion-cache:
  owntube-data:
