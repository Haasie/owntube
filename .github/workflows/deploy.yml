name: CI/CD owntube

# Standaardpipeline (deploy-cosmos-cloud skill). Gemaakt voor private repos op GitHub Free:
# geen branch protection of environments, dus de poorten zitten in de workflow zelf. Een image
# wordt alleen gepusht als secret-scan, checks en image-scan allemaal slagen.
#
# Uitrollen gebeurt NIET vanuit deze workflow: Cosmos' eigen auto-update (label
# cosmos-auto-update=true) haalt elke nacht om 02:00 het nieuwe :latest op en hercreëert de
# container. Zie COSMOS_SETUP.md.
#
# Supply chain: actions op commit-SHA, scanners op digest (node driver.mjs refresh-pins),
# GITHUB_TOKEN standaard zonder rechten, SBOM + provenance op elk image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Wekelijks opnieuw bouwen en scannen: nieuwe CVE's en OS-patches in basis-images.
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  secrets:
    name: Secret-scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks over de volledige historie
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git --redact --no-banner --exit-code 1 /repo

  node:
    name: Node (pnpm audit, lint, tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Afhankelijkheden (lockfile, geen install-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native modules bouwen (alleen deze, bewust)
        # --ignore-scripts slaat ook de build van native bindings over; de tests hebben
        # better-sqlite3 en bcrypt echt nodig. Alleen deze twee draaien hun install-script.
        run: pnpm --filter web rebuild better-sqlite3 bcrypt
      - name: Bekende kwetsbaarheden (pnpm audit, productie)
        # Alleen productie-afhankelijkheden: devDependencies komen niet in het image,
        # en de image-scan (Trivy) hieronder dekt wat er wel in zit.
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test

  image:
    name: Image ${{ matrix.name }} (build, scan, push)
    needs: [secrets, node]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: owntube
            image: haasie/owntube
            context: .
            file: apps/web/Dockerfile
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker-metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            cosmos-auto-update=true
      - name: OS-patchdatum (breekt de cache van de OS-upgrade-laag één keer per dag)
        id: osdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Bouwen (lokaal, voor de scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            OS_PATCH_DATE=${{ steps.osdate.outputs.date }}
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Image-scan (Trivy, CRITICAL/HIGH met beschikbare fix)
        env:
          SCAN_REF: scan/${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln,secret \
            --no-progress "$SCAN_REF"
      - name: Inloggen bij GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pushen (met SBOM en provenance)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            OS_PATCH_DATE=${{ steps.osdate.outputs.date }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Samenvatting
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "|---|---|"
            echo "| Digest | \`${DIGEST}\` |"
            echo
            echo "Cosmos haalt dit image vannacht om 02:00 op (label cosmos-auto-update)."
            echo "Direct live nodig? Cosmos → ServApps → container → **Update**."
          } >> "$GITHUB_STEP_SUMMARY"
