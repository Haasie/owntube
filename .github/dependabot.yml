# Houdt vastgepinde versies actueel; updates doorlopen dezelfde CI-poorten.
# cooldown: alleen releases van minstens 14 dagen oud.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
